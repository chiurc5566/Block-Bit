<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#070c14" />
<title>打磚塊 · Breakout</title>
<style>
  :root {
    --bg: #060a11;
    --text: #e9f3fc;
    --muted: #8ba3b8;
    --line: rgba(148, 180, 204, .16);
    --cyan: #46e3cd;
    --blue: #4d9dff;
    --danger: #fb7185;
    --font: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 18px clamp(12px, 3vw, 28px);
    font-family: var(--font);
    color: var(--text);
    background:
      radial-gradient(900px 520px at 12% -10%, rgba(56, 189, 248, .16), transparent 62%),
      radial-gradient(780px 520px at 105% 110%, rgba(124, 58, 237, .18), transparent 58%),
      radial-gradient(700px 380px at 50% 120%, rgba(20, 184, 166, .10), transparent 60%),
      var(--bg);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .app {
    width: min(940px, 100%);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ── 頂部資訊列 ─────────────────────────── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    letter-spacing: .02em;
    font-size: 15px;
    white-space: nowrap;
  }

  .brand .logo {
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    border-radius: 10px;
    font-size: 16px;
    background: linear-gradient(145deg, #123243, #0a1a26);
    border: 1px solid var(--line);
    box-shadow: 0 6px 18px -10px rgba(70, 227, 205, .8);
  }

  .brand em {
    font-style: normal;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .22em;
    color: var(--muted);
    display: block;
    margin-top: -2px;
  }

  .hud {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .stat {
    display: flex;
    align-items: baseline;
    gap: 7px;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .045);
    border: 1px solid var(--line);
  }

  .stat span {
    font-size: 11px;
    letter-spacing: .08em;
    color: var(--muted);
  }

  .stat b {
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
  }

  #score { color: var(--cyan); }
  #level { color: #a5c8ff; }
  #lives { color: var(--danger); letter-spacing: .08em; }

  .icon-btn {
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, .045);
    color: var(--text);
    font-size: 15px;
    cursor: pointer;
    transition: background .18s, transform .18s;
  }
  .icon-btn:hover { background: rgba(255, 255, 255, .1); transform: translateY(-1px); }

  /* ── 遊戲舞台 ───────────────────────────── */
  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    border-radius: 20px;
    overflow: hidden;
    background: #08111b;
    border: 1px solid var(--line);
    box-shadow:
      0 40px 90px -40px rgba(0, 0, 0, .95),
      0 0 0 1px rgba(70, 227, 205, .04),
      inset 0 1px 0 rgba(255, 255, 255, .05);
    touch-action: none;
  }

  .stage canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: none;
    touch-action: none;
  }

  /* ── 覆蓋面板 ───────────────────────────── */
  .overlay {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 22px;
    text-align: center;
    background: radial-gradient(70% 70% at 50% 45%, rgba(8, 16, 26, .55), rgba(5, 9, 15, .82));
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .28s ease;
    z-index: 5;
  }

  .overlay.show { opacity: 1; pointer-events: auto; }

  .panel {
    width: min(420px, 100%);
    transform: translateY(8px) scale(.98);
    transition: transform .32s cubic-bezier(.2, .9, .3, 1.2);
  }
  .overlay.show .panel { transform: translateY(0) scale(1); }

  .badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    border: 1px solid rgba(70, 227, 205, .3);
    background: rgba(70, 227, 205, .1);
    color: var(--cyan);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .28em;
    text-transform: uppercase;
  }

  .panel h2 {
    margin: 14px 0 8px;
    font-size: clamp(26px, 5.4vw, 38px);
    line-height: 1.15;
    letter-spacing: -.01em;
    background: linear-gradient(120deg, #ffffff, #a7f3e5 55%, #8cc2ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .panel p {
    margin: 0 auto 20px;
    max-width: 34ch;
    font-size: 13.5px;
    line-height: 1.7;
    color: #b9cbdb;
  }

  .btn {
    appearance: none;
    border: 0;
    cursor: pointer;
    padding: 13px 34px;
    border-radius: 13px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: .06em;
    color: #04141a;
    background: linear-gradient(135deg, #5cf0da, #46b7ff 70%, #7aa9ff);
    box-shadow: 0 14px 34px -14px rgba(70, 227, 205, .85), inset 0 1px 0 rgba(255, 255, 255, .55);
    transition: transform .16s ease, box-shadow .16s ease, filter .16s;
  }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.05); box-shadow: 0 20px 42px -16px rgba(70, 227, 205, .95); }
  .btn:active { transform: translateY(0) scale(.985); }
  .btn:focus-visible { outline: 2px solid #bff7ee; outline-offset: 3px; }

  .keys {
    margin: 18px 0 0;
    font-size: 11.5px;
    color: #7c93a8;
    letter-spacing: .03em;
  }

  .footer {
    margin: 0;
    text-align: center;
    font-size: 11.5px;
    color: #6f8699;
    letter-spacing: .04em;
  }

  @media (max-width: 560px) {
    .brand { font-size: 13px; }
    .stat { padding: 5px 9px; gap: 5px; }
    .stat span { font-size: 10px; }
    .stat b { font-size: 13px; }
    .icon-btn { width: 32px; height: 32px; }
    .hud { gap: 6px; }
    .footer { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <span class="logo">🧱</span>
      <span>打磚塊<em>BREAKOUT</em></span>
    </div>
    <div class="hud">
      <div class="stat"><span>分數</span><b id="score">0</b></div>
      <div class="stat"><span>最高</span><b id="best">0</b></div>
      <div class="stat"><span>關卡</span><b id="level">1</b></div>
      <div class="stat"><span>生命</span><b id="lives">♥♥♥</b></div>
      <button class="icon-btn" id="muteBtn" type="button" aria-label="切換音效" aria-pressed="false">🔊</button>
    </div>
  </div>

  <div class="stage" id="stage">
    <canvas id="game" width="800" height="600"></canvas>
    <div class="overlay show" id="overlay" aria-hidden="false">
      <div class="panel">
        <span class="badge" id="ovBadge">Breakout</span>
        <h2 id="ovTitle">打磚塊</h2>
        <p id="ovText">移動擋板接住球，把上方的磚塊全部擊碎。每過一關，速度會更快。</p>
        <button class="btn" id="ovBtn" type="button">開始遊戲</button>
        <p class="keys">滑鼠／手指移動 · 空白鍵發球 · P 暫停 · M 靜音</p>
      </div>
    </div>
  </div>

  <p class="footer">接住掉落的道具：寬＝加長擋板 · 多＝分裂球 · 慢＝減速 · ♥＝加命</p>
</div>

<script>
(() => {
  'use strict';

  /* ══════════════ 常數 ══════════════ */
  const W = 800, H = 600;
  const PADDLE_Y = 552, PADDLE_H = 14, PADDLE_W = 112;
  const BALL_R = 8;
  const BRICK_MARGIN = 44, BRICK_GAP = 6, BRICK_TOP = 66, BRICK_H = 26;
  const FONT = '"Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif';

  const LEVELS = [
    ['1111111111', '1111111111', '1111111111', '1111111111', '1111111111'],
    ['0000220000', '0002222000', '0022222200', '0222222220', '1111111111'],
    ['3333333333', '0222222220', '0011111100', '0001111000', '0000110000'],
    ['S11111111S', 'S22222222S', 'S33333333S', '0111111110', '0022222200'],
    ['2111111112', '1S222222S1', '12S3333S21', '123S11S321', '0123113210'],
  ];

  const BRICK_COLORS = {
    '1': ['#5eead4', '#0d9488'],
    '2': ['#93c5fd', '#2563eb'],
    '3': ['#d8b4fe', '#7e22ce'],
    steel: ['#cbd5e1', '#475569'],
  };

  const POWER_DEFS = {
    wide:  { label: '寬', color: '#38bdf8', weight: 30 },
    multi: { label: '多', color: '#f472b6', weight: 26 },
    slow:  { label: '慢', color: '#a78bfa', weight: 26 },
    life:  { label: '♥', color: '#fb7185', weight: 10 },
  };

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const rand = (a, b) => a + Math.random() * (b - a);

  /* ══════════════ DOM ══════════════ */
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const els = {
    score: document.getElementById('score'),
    best: document.getElementById('best'),
    level: document.getElementById('level'),
    lives: document.getElementById('lives'),
    mute: document.getElementById('muteBtn'),
    overlay: document.getElementById('overlay'),
    badge: document.getElementById('ovBadge'),
    title: document.getElementById('ovTitle'),
    text: document.getElementById('ovText'),
    btn: document.getElementById('ovBtn'),
  };

  /* ══════════════ 狀態 ══════════════ */
  const state = {
    mode: 'menu',      // menu | ready | playing | paused | clear | over
    prevMode: 'playing',
    score: 0,
    level: 0,
    lives: 3,
    combo: 0,
    speedBonus: 1,
    slowTimer: 0,
    wideTimer: 0,
    shake: 0,
    flash: 0,
    time: 0,
  };

  const paddle = { cx: W / 2, y: PADDLE_Y, w: PADDLE_W, h: PADDLE_H, targetW: PADDLE_W, vx: 0 };
  const keys = { left: false, right: false };
  const pointer = { aim: W / 2 };

  const balls = [];
  const bricks = [];
  const powers = [];
  const particles = [];
  const popups = [];
  const stars = [];

  let best = 0;
  let muted = false;
  try {
    best = Number(localStorage.getItem('breakout.best')) || 0;
    muted = localStorage.getItem('breakout.muted') === '1';
  } catch (e) { /* 忽略 */ }

  let primaryAction = null;
  let last = performance.now();
  let wallSoundAt = 0;

  /* ══════════════ 音效 ══════════════ */
  let audio = null;

  function initAudio() {
    if (!audio) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) { try { audio = new AC(); } catch (e) { audio = null; } }
    }
    if (audio && audio.state === 'suspended') audio.resume();
  }

  function tone(freq, dur, type, vol, slideTo) {
    if (!audio || muted) return;
    const t = audio.currentTime;
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), t + dur);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audio.destination);
    osc.start(t);
    osc.stop(t + dur + 0.03);
  }

  const sfx = {
    wall()   { const now = performance.now(); if (now - wallSoundAt > 40) { wallSoundAt = now; tone(260, .05, 'sine', .028); } },
    paddle() { tone(300, .09, 'triangle', .05, 430); },
    brick(hp) { tone(420 + hp * 90, .07, 'square', .03, 560 + hp * 90); },
    smash()  { tone(660, .1, 'square', .035, 980); },
    steel()  { tone(180, .05, 'square', .025); },
    power()  { tone(520, .14, 'triangle', .05, 1040); },
    launch() { tone(180, .12, 'triangle', .04, 540); },
    lose()   { tone(240, .45, 'sawtooth', .05, 70); },
    clear()  { [0, 90, 180, 300].forEach((ms, i) => setTimeout(() => tone([523, 659, 784, 1046][i], .18, 'triangle', .045), ms)); },
  };

  function setMuted(next) {
    muted = next;
    els.mute.textContent = muted ? '🔇' : '🔊';
    els.mute.setAttribute('aria-pressed', String(muted));
    try { localStorage.setItem('breakout.muted', muted ? '1' : '0'); } catch (e) { /* 忽略 */ }
    if (!muted) initAudio();
  }

  /* ══════════════ 分數與 HUD ══════════════ */
  function addScore(n) {
    state.score += n;
    els.score.textContent = state.score;
    if (state.score > best) {
      best = state.score;
      els.best.textContent = best;
      try { localStorage.setItem('breakout.best', String(best)); } catch (e) { /* 忽略 */ }
    }
  }

  function updateHUD() {
    els.score.textContent = state.score;
    els.best.textContent = Math.max(best, state.score);
    els.level.textContent = state.level + 1;
    els.lives.textContent = state.lives > 0 ? '♥'.repeat(state.lives) : '—';
  }

  /* ══════════════ 覆蓋面板 ══════════════ */
  function showOverlay({ badge, title, text, btn, action }) {
    els.badge.textContent = badge;
    els.title.textContent = title;
    els.text.textContent = text;
    els.btn.textContent = btn;
    primaryAction = action;
    els.overlay.classList.add('show');
    els.overlay.setAttribute('aria-hidden', 'false');
    setTimeout(() => { if (els.overlay.classList.contains('show')) els.btn.focus({ preventScroll: true }); }, 40);
  }

  function hideOverlay() {
    primaryAction = null;
    els.overlay.classList.remove('show');
    els.overlay.setAttribute('aria-hidden', 'true');
    if (document.activeElement === els.btn) els.btn.blur();
  }

  /* ══════════════ 關卡與球 ══════════════ */
  function buildBricks(levelIndex) {
    const layout = LEVELS[levelIndex % LEVELS.length];
    const cols = layout[0].length;
    const bw = (W - BRICK_MARGIN * 2 - BRICK_GAP * (cols - 1)) / cols;
    const list = [];
    layout.forEach((row, r) => {
      for (let c = 0; c < cols; c++) {
        const ch = row[c];
        if (!ch || ch === '0') continue;
        const steel = ch === 'S';
        const hp = steel ? Infinity : Number(ch);
        list.push({
          x: BRICK_MARGIN + c * (bw + BRICK_GAP),
          y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
          w: bw, h: BRICK_H,
          hp, maxHp: hp, steel,
        });
      }
    });
    return list;
  }

  function makeBall(x, y, vx, vy) {
    return { x, y, vx, vy, r: BALL_R, trail: [], stuck: false };
  }

  function currentSpeed() {
    const base = 330 + Math.min(state.level, 15) * 17;
    return base * state.speedBonus * (state.slowTimer > 0 ? 0.66 : 1);
  }

  function normalizeBall(b, speed) {
    const m = Math.hypot(b.vx, b.vy);
    if (!m) return;
    b.vx = (b.vx / m) * speed;
    b.vy = (b.vy / m) * speed;
  }

  function normalizeAllBalls() {
    const s = currentSpeed();
    for (const b of balls) if (!b.stuck) normalizeBall(b, s);
  }

  function startGame() {
    hideOverlay();
    state.score = 0;
    state.level = 0;
    state.lives = 3;
    startLevel();
  }

  function startLevel() {
    bricks.length = 0;
    bricks.push(...buildBricks(state.level));
    powers.length = 0;
    particles.length = 0;
    popups.length = 0;
    state.combo = 0;
    state.speedBonus = 1;
    state.slowTimer = 0;
    state.wideTimer = 0;
    paddle.targetW = PADDLE_W;
    balls.length = 0;
    const ball = makeBall(paddle.cx, paddle.y - BALL_R - 2, 0, 0);
    ball.stuck = true;
    balls.push(ball);
    state.mode = 'ready';
    updateHUD();
  }

  function resetBall() {
    balls.length = 0;
    powers.length = 0;
    const ball = makeBall(paddle.cx, paddle.y - BALL_R - 2, 0, 0);
    ball.stuck = true;
    balls.push(ball);
    state.mode = 'ready';
  }

  function launchBall() {
    if (state.mode !== 'ready') return;
    const b = balls[0];
    if (!b) return;
    b.stuck = false;
    const s = currentSpeed();
    const angle = rand(-0.34, 0.34);
    b.vx = Math.sin(angle) * s;
    b.vy = -Math.cos(angle) * s;
    state.mode = 'playing';
    sfx.launch();
  }

  /* ══════════════ 擋板 ══════════════ */
  function updatePaddle(dt) {
    const canMove = state.mode === 'playing' || state.mode === 'ready' || state.mode === 'menu';
    if (canMove) {
      if (keys.left) pointer.aim -= 660 * dt;
      if (keys.right) pointer.aim += 660 * dt;
      pointer.aim = clamp(pointer.aim, paddle.w / 2, W - paddle.w / 2);

      const prev = paddle.cx;
      paddle.cx += (pointer.aim - paddle.cx) * Math.min(1, dt * 24);
      paddle.cx = clamp(paddle.cx, paddle.w / 2, W - paddle.w / 2);
      paddle.vx = dt > 0 ? (paddle.cx - prev) / dt : 0;
    } else {
      paddle.vx = 0;
    }

    paddle.w += (paddle.targetW - paddle.w) * Math.min(1, dt * 12);

    if (state.mode === 'ready') {
      for (const b of balls) {
        if (b.stuck) {
          b.x = paddle.cx;
          b.y = paddle.y - b.r - 2;
        }
      }
    }
  }

  /* ══════════════ 遊戲更新 ══════════════ */
  function updateGame(dt) {
    if (state.slowTimer > 0) {
      state.slowTimer -= dt;
      if (state.slowTimer <= 0) {
        state.slowTimer = 0;
        normalizeAllBalls();
      }
    }
    if (state.wideTimer > 0) {
      state.wideTimer -= dt;
      if (state.wideTimer <= 0) {
        state.wideTimer = 0;
        paddle.targetW = PADDLE_W;
      }
    }

    let fell = false;
    for (let i = balls.length - 1; i >= 0; i--) {
      const b = balls[i];
      if (!b.stuck) {
        b.trail.push({ x: b.x, y: b.y });
        if (b.trail.length > 9) b.trail.shift();
      }
      moveBall(b, dt);
      if (b.y - b.r > H + 12) {
        balls.splice(i, 1);
        fell = true;
      }
    }

    if (fell && balls.length === 0) {
      loseLife();
      return;
    }

    updatePowers(dt);

    if (!bricks.some((br) => !br.steel && br.hp > 0)) {
      levelClear();
    }
  }

  function moveBall(b, dt) {
    const speed = Math.hypot(b.vx, b.vy);
    const steps = Math.max(1, Math.ceil((speed * dt) / 6));
    const sdt = dt / steps;
    for (let s = 0; s < steps; s++) {
      b.x += b.vx * sdt;
      b.y += b.vy * sdt;
      bounceWalls(b);
      bouncePaddle(b);
      bounceBricks(b);
    }
  }

  function bounceWalls(b) {
    const r = b.r;
    if (b.x - r < 0) {
      b.x = r;
      b.vx = Math.abs(b.vx);
      sfx.wall();
    } else if (b.x + r > W) {
      b.x = W - r;
      b.vx = -Math.abs(b.vx);
      sfx.wall();
    }
    if (b.y - r < 0) {
      b.y = r;
      b.vy = Math.abs(b.vy);
      sfx.wall();
    }
  }

  function bouncePaddle(b) {
    if (b.vy <= 0) return;
    const px = paddle.cx - paddle.w / 2;
    if (b.y + b.r < paddle.y || b.y - b.r > paddle.y + paddle.h) return;
    if (!circleRectHit(b, px, paddle.y, paddle.w, paddle.h)) return;

    b.y = paddle.y - b.r - 0.5;
    const offset = clamp((b.x - paddle.cx) / (paddle.w / 2), -1, 1);
    const angle = offset * 1.05;
    const s = currentSpeed();
    b.vx = Math.sin(angle) * s + clamp(paddle.vx * 0.1, -120, 120);
    b.vy = -Math.abs(Math.cos(angle) * s);
    normalizeBall(b, s);

    state.speedBonus = Math.min(1.22, state.speedBonus + 0.012);
    state.combo = 0;

    for (let i = 0; i < 5; i++) {
      particles.push({
        x: b.x, y: paddle.y, vx: rand(-60, 60), vy: rand(-160, -40),
        life: rand(0.25, 0.45), maxLife: 0.45, size: rand(2, 4),
        color: '#67e8f9', shape: 'circle',
      });
    }
    sfx.paddle();
  }

  function bounceBricks(b) {
    for (const br of bricks) {
      if (br.hp <= 0) continue;
      if (!circleRectHit(b, br.x, br.y, br.w, br.h)) continue;

      const dx = b.x - (br.x + br.w / 2);
      const dy = b.y - (br.y + br.h / 2);
      const ox = br.w / 2 + b.r - Math.abs(dx);
      const oy = br.h / 2 + b.r - Math.abs(dy);

      if (ox < oy) {
        b.vx = -b.vx;
        b.x += dx < 0 ? -ox : ox;
      } else {
        b.vy = -b.vy;
        b.y += dy < 0 ? -oy : oy;
      }
      normalizeBall(b, currentSpeed());
      damageBrick(br);
      break;
    }
  }

  function damageBrick(br) {
    const cx = br.x + br.w / 2;
    const cy = br.y + br.h / 2;

    if (br.steel) {
      burst(cx, cy, '#94a3b8', 5, 2.2);
      sfx.steel();
      return;
    }

    br.hp -= 1;

    if (br.hp > 0) {
      burst(cx, cy, BRICK_COLORS[String(br.maxHp)][0], 5, 2.4);
      sfx.brick(br.hp);
      return;
    }

    state.combo += 1;
    const mult = Math.min(5, 1 + Math.floor((state.combo - 1) / 3));
    const gain = 10 * br.maxHp * mult;
    addScore(gain);
    popups.push({
      x: cx, y: cy, text: mult > 1 ? `+${gain} ×${mult}` : `+${gain}`,
      life: 0.85, maxLife: 0.85, color: mult > 1 ? '#fde68a' : '#a7f3d0',
      size: mult > 1 ? 15 : 13,
    });
    burst(cx, cy, BRICK_COLORS[String(br.maxHp)][0], 11, 3.2);
    burst(cx, cy, BRICK_COLORS[String(br.maxHp)][1], 5, 2.6);
    state.shake = Math.min(7, state.shake + 1.8);
    maybeDropPower(cx, cy);
    sfx.smash();
  }

  /* ══════════════ 道具 ══════════════ */
  function selectPowerType() {
    const pool = Object.entries(POWER_DEFS).filter(([key]) => key !== 'life' || state.lives < 5);
    const total = pool.reduce((sum, [, def]) => sum + def.weight, 0);
    let pick = Math.random() * total;
    for (const [key, def] of pool) {
      pick -= def.weight;
      if (pick <= 0) return key;
    }
    return pool[0][0];
  }

  function maybeDropPower(x, y) {
    if (powers.length >= 3 || Math.random() > 0.14) return;
    const type = selectPowerType();
    powers.push({
      x, y, vy: 150, w: 30, h: 22,
      type, color: POWER_DEFS[type].color, label: POWER_DEFS[type].label,
      phase: rand(0, Math.PI * 2),
    });
  }

  function updatePowers(dt) {
    const px = paddle.cx - paddle.w / 2;
    for (let i = powers.length - 1; i >= 0; i--) {
      const p = powers[i];
      p.y += p.vy * dt;
      if (p.y - p.h / 2 > H) {
        powers.splice(i, 1);
        continue;
      }
      const caught =
        p.y + p.h / 2 > paddle.y &&
        p.y - p.h / 2 < paddle.y + paddle.h &&
        p.x > px - 10 &&
        p.x < px + paddle.w + 10;
      if (caught) {
        applyPower(p);
        powers.splice(i, 1);
      }
    }
  }

  function applyPower(p) {
    switch (p.type) {
      case 'wide':
        paddle.targetW = Math.min(196, PADDLE_W * 1.6);
        state.wideTimer = 12;
        break;
      case 'multi':
        multiBall();
        break;
      case 'slow':
        state.slowTimer = 8;
        normalizeAllBalls();
        break;
      case 'life':
        state.lives = Math.min(5, state.lives + 1);
        break;
    }
    addScore(20);
    updateHUD();
    popups.push({
      x: p.x, y: p.y, text: p.label, life: 0.9, maxLife: 0.9,
      color: p.color, size: 18,
    });
    burst(p.x, p.y, p.color, 12, 3);
    sfx.power();
  }

  function multiBall() {
    const src = balls[0];
    if (!src) return;
    const baseAngle = Math.atan2(src.vy, src.vx);
    for (const da of [-0.5, 0.5]) {
      if (balls.length >= 8) break;
      const a = baseAngle + da;
      const s = currentSpeed();
      balls.push(makeBall(src.x, src.y, Math.cos(a) * s, Math.sin(a) * s));
    }
  }

  /* ══════════════ 生命、過關與結束 ══════════════ */
  function loseLife() {
    state.lives -= 1;
    state.combo = 0;
    state.speedBonus = 1;
    state.slowTimer = 0;
    state.wideTimer = 0;
    paddle.targetW = PADDLE_W;
    state.shake = 9;
    state.flash = 0.55;
    updateHUD();
    sfx.lose();

    if (state.lives <= 0) {
      gameOver();
    } else {
      resetBall();
    }
  }

  function levelClear() {
    state.mode = 'clear';
    addScore(100 + state.level * 50);
    state.flash = 0.3;
    state.shake = 5;
    sfx.clear();
    const nextLevel = state.level + 1;
    setTimeout(() => {
      if (state.mode !== 'clear') return;
      showOverlay({
        badge: '關卡完成',
        title: `第 ${state.level + 1} 關 通過`,
        text: `目前得分 ${state.score} · 最高分 ${Math.max(best, state.score)}。下一關速度會更快。`,
        btn: '下一關',
        action: () => {
          state.level = nextLevel;
          startLevel();
          hideOverlay();
        },
      });
    }, 550);
  }

  function gameOver() {
    state.mode = 'over';
    balls.length = 0;
    showOverlay({
      badge: '遊戲結束',
      title: '挑戰結束',
      text: `本局得分 ${state.score} · 最高分 ${Math.max(best, state.score)} · 抵達第 ${state.level + 1} 關。`,
      btn: '再玩一次',
      action: startGame,
    });
  }

  /* ══════════════ 特效 ══════════════ */
  function burst(x, y, color, count, power) {
    for (let i = 0; i < count; i++) {
      const a = rand(0, Math.PI * 2);
      const sp = rand(40, 140) * power * 0.5;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 40,
        life: rand(0.35, 0.8),
        maxLife: 0.8,
        size: rand(2, 5),
        color,
        shape: Math.random() > 0.35 ? 'rect' : 'circle',
        spin: rand(-8, 8),
        rot: rand(0, Math.PI),
      });
    }
  }

  function updateEffects(dt) {
    state.shake = Math.max(0, state.shake - dt * 34);
    state.flash = Math.max(0, state.flash - dt * 1.8);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += 420 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot = (p.rot || 0) + (p.spin || 0) * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i];
      p.y -= 26 * dt;
      p.life -= dt;
      if (p.life <= 0) popups.splice(i, 1);
    }
  }

  /* ══════════════ 繪圖工具 ══════════════ */
  function roundRect(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function circleRectHit(b, x, y, w, h) {
    const nx = clamp(b.x, x, x + w);
    const ny = clamp(b.y, y, y + h);
    const dx = b.x - nx;
    const dy = b.y - ny;
    return dx * dx + dy * dy <= b.r * b.r;
  }

  /* ══════════════ 背景 ══════════════ */
  let bgGrad = null;
  let glowGrad = null;
  let vignette = null;

  function buildStars() {
    stars.length = 0;
    for (let i = 0; i < 58; i++) {
      stars.push({
        x: rand(6, W - 6),
        y: rand(6, H - 6),
        r: rand(0.5, 1.7),
        a: rand(0.15, 0.7),
        phase: rand(0, Math.PI * 2),
      });
    }
  }

  function drawBackground() {
    if (!bgGrad) {
      bgGrad = ctx.createLinearGradient(0, 0, 0, H);
      bgGrad.addColorStop(0, '#081220');
      bgGrad.addColorStop(0.55, '#0a1724');
      bgGrad.addColorStop(1, '#070f18');
      glowGrad = ctx.createRadialGradient(W / 2, 150, 20, W / 2, 150, 430);
      glowGrad.addColorStop(0, 'rgba(56, 189, 248, .11)');
      glowGrad.addColorStop(1, 'rgba(56, 189, 248, 0)');
      vignette = ctx.createRadialGradient(W / 2, H / 2, H * 0.34, W / 2, H / 2, H * 0.9);
      vignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
      vignette.addColorStop(1, 'rgba(0, 0, 0, .55)');
    }

    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = glowGrad;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = 'rgba(120, 170, 200, .045)';
    ctx.lineWidth = 1;
    for (let x = 40; x < W; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x + 0.5, 0);
      ctx.lineTo(x + 0.5, H);
      ctx.stroke();
    }

    for (const s of stars) {
      const tw = 0.55 + 0.45 * Math.sin(state.time * 1.6 + s.phase);
      ctx.globalAlpha = s.a * tw;
      ctx.fillStyle = '#d8f3ff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.fillStyle = 'rgba(70, 227, 205, .05)';
    ctx.fillRect(0, PADDLE_Y + 36, W, 1);
  }

  /* ══════════════ 磚塊 ══════════════ */
  function drawBricks() {
    for (const br of bricks) {
      if (br.hp <= 0) continue;
      const key = br.steel ? 'steel' : String(br.maxHp);
      const colors = BRICK_COLORS[key] || BRICK_COLORS['1'];

      const grad = ctx.createLinearGradient(br.x, br.y, br.x, br.y + br.h);
      grad.addColorStop(0, colors[0]);
      grad.addColorStop(1, colors[1]);

      roundRect(br.x, br.y, br.w, br.h, 7);
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.save();
      roundRect(br.x, br.y, br.w, br.h, 7);
      ctx.clip();

      ctx.fillStyle = 'rgba(255, 255, 255, .2)';
      roundRect(br.x + 2, br.y + 2, br.w - 4, br.h * 0.32, 6);
      ctx.fill();

      if (br.steel) {
        ctx.strokeStyle = 'rgba(255, 255, 255, .12)';
        ctx.lineWidth = 1.5;
        for (let i = -br.h; i < br.w; i += 9) {
          ctx.beginPath();
          ctx.moveTo(br.x + i, br.y + br.h);
          ctx.lineTo(br.x + i + br.h, br.y);
          ctx.stroke();
        }
      } else if (br.hp < br.maxHp) {
        ctx.fillStyle = 'rgba(0, 0, 0, .3)';
        ctx.fillRect(br.x, br.y, br.w, br.h);
        ctx.strokeStyle = 'rgba(255, 255, 255, .32)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(br.x + br.w * 0.28, br.y + 3);
        ctx.lineTo(br.x + br.w * 0.4, br.y + br.h * 0.6);
        ctx.lineTo(br.x + br.w * 0.3, br.y + br.h - 3);
        ctx.moveTo(br.x + br.w * 0.66, br.y + br.h - 3);
        ctx.lineTo(br.x + br.w * 0.56, br.y + br.h * 0.5);
        ctx.stroke();
      }
      ctx.restore();

      ctx.strokeStyle = 'rgba(255, 255, 255, .16)';
      ctx.lineWidth = 1;
      roundRect(br.x + 0.5, br.y + 0.5, br.w - 1, br.h - 1, 7);
      ctx.stroke();
    }
  }

  /* ══════════════ 道具 ══════════════ */
  function drawPowers() {
    for (const p of powers) {
      const bob = Math.sin(state.time * 4.5 + p.phase) * 2;
      ctx.save();
      ctx.translate(p.x, p.y + bob);
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 16;

      roundRect(-p.w / 2, -p.h / 2, p.w, p.h, 8);
      ctx.fillStyle = 'rgba(8, 16, 26, .92)';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = p.color;
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.fillStyle = p.color;
      ctx.font = `800 13px ${FONT}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.label, 0, 1);
      ctx.restore();
    }
    ctx.textBaseline = 'alphabetic';
  }

  /* ══════════════ 擋板 ══════════════ */
  function drawPaddle() {
    const x = paddle.cx - paddle.w / 2;
    const wide = state.wideTimer > 0;
    const grad = ctx.createLinearGradient(x, paddle.y, x, paddle.y + paddle.h);
    grad.addColorStop(0, wide ? '#fef3c7' : '#d9fbff');
    grad.addColorStop(0.45, wide ? '#fbbf24' : '#67e8f9');
    grad.addColorStop(1, wide ? '#b45309' : '#0891b2');

    ctx.save();
    ctx.shadowColor = wide ? 'rgba(251, 191, 36, .9)' : 'rgba(103, 232, 249, .85)';
    ctx.shadowBlur = 20;
    roundRect(x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = 'rgba(255, 255, 255, .65)';
    roundRect(x + 6, paddle.y + 2.5, paddle.w - 12, 3, 2);
    ctx.fill();

    ctx.fillStyle = wide ? 'rgba(120, 53, 15, .35)' : 'rgba(8, 28, 40, .38)';
    roundRect(paddle.cx - 14, paddle.y + paddle.h - 5, 28, 2.5, 2);
    ctx.fill();
  }

  /* ══════════════ 球 ══════════════ */
  function drawBalls() {
    for (const b of balls) {
      for (let i = 0; i < b.trail.length; i++) {
        const t = b.trail[i];
        const k = (i + 1) / b.trail.length;
        ctx.globalAlpha = k * 0.22;
        ctx.fillStyle = '#7dd3fc';
        ctx.beginPath();
        ctx.arc(t.x, t.y, b.r * (0.35 + k * 0.6), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      ctx.save();
      ctx.shadowColor = 'rgba(125, 211, 252, .95)';
      ctx.shadowBlur = 18;
      const g = ctx.createRadialGradient(b.x - 3, b.y - 3, 1, b.x, b.y, b.r * 1.25);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.45, '#e0f2fe');
      g.addColorStop(1, '#38bdf8');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  /* ══════════════ 粒子與浮動文字 ══════════════ */
  function drawParticles() {
    for (const p of particles) {
      const a = clamp(p.life / p.maxLife, 0, 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      const s = p.size * (0.4 + a * 0.6);
      if (p.shape === 'rect') {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot || 0);
        ctx.fillRect(-s / 2, -s / 2, s, s);
        ctx.restore();
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, s / 2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawPopups() {
    ctx.textAlign = 'center';
    for (const p of popups) {
      const t = 1 - p.life / p.maxLife;
      ctx.globalAlpha = clamp(1 - t, 0, 1);
      ctx.fillStyle = p.color;
      ctx.font = `800 ${p.size || 13}px ${FONT}`;
      ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
  }

  /* ══════════════ 提示與主繪製 ══════════════ */
  function drawReadyHint() {
    if (state.mode !== 'ready') return;
    const a = 0.5 + Math.sin(state.time * 3) * 0.25;
    ctx.globalAlpha = a;
    ctx.fillStyle = '#dbeafe';
    ctx.font = `600 14px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.fillText('點擊畫面或按 空白鍵 發球', W / 2, paddle.y - 42);
    ctx.globalAlpha = 1;
  }

  function draw() {
    const sx = canvas.width / W;
    const sy = canvas.height / H;
    ctx.setTransform(sx, 0, 0, sy, 0, 0);
    ctx.clearRect(0, 0, W, H);

    drawBackground();

    ctx.save();
    if (state.shake > 0.15) {
      ctx.translate(rand(-0.5, 0.5) * state.shake, rand(-0.5, 0.5) * state.shake);
    }
    drawBricks();
    drawPowers();
    drawParticles();
    drawPaddle();
    drawBalls();
    drawPopups();
    drawReadyHint();
    ctx.restore();

    ctx.setTransform(sx, 0, 0, sy, 0, 0);
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);

    if (state.flash > 0) {
      ctx.fillStyle = `rgba(251, 113, 133, ${state.flash * 0.3})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  /* ══════════════ 流程控制 ══════════════ */
  function pauseGame() {
    if (state.mode !== 'playing' && state.mode !== 'ready') return;
    state.prevMode = state.mode;
    state.mode = 'paused';
    showOverlay({
      badge: '暫停',
      title: '已暫停',
      text: `第 ${state.level + 1} 關 · 得分 ${state.score}。按 P 或點擊按鈕繼續。`,
      btn: '繼續遊戲',
      action: resumeGame,
    });
  }

  function resumeGame() {
    if (state.mode !== 'paused') return;
    state.mode = state.prevMode || 'playing';
    hideOverlay();
    last = performance.now();
  }

  /* ══════════════ 輸入 ══════════════ */
  function toLogicalX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return clamp(((clientX - rect.left) / Math.max(1, rect.width)) * W, 0, W);
  }

  canvas.addEventListener('pointermove', (e) => {
    pointer.aim = toLogicalX(e.clientX);
  });

  canvas.addEventListener('pointerdown', (e) => {
    initAudio();
    pointer.aim = toLogicalX(e.clientX);
    if (state.mode === 'ready') launchBall();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    e.preventDefault();
  });

  window.addEventListener('keydown', (e) => {
    initAudio();
    const k = e.key;

    if (k === ' ' || k === 'Spacebar') {
      e.preventDefault();
      if (state.mode === 'ready') launchBall();
      else if (state.mode === 'menu') startGame();
      else if (state.mode === 'paused') resumeGame();
      else if ((state.mode === 'clear' || state.mode === 'over') && primaryAction) primaryAction();
      return;
    }

    if (k === 'ArrowLeft' || k === 'a' || k === 'A') {
      keys.left = true;
      e.preventDefault();
    } else if (k === 'ArrowRight' || k === 'd' || k === 'D') {
      keys.right = true;
      e.preventDefault();
    } else if (k === 'p' || k === 'P' || k === 'Escape') {
      if (state.mode === 'paused') resumeGame();
      else pauseGame();
    } else if (k === 'm' || k === 'M') {
      setMuted(!muted);
    } else if (k === 'Enter') {
      if ((state.mode === 'clear' || state.mode === 'over' || state.mode === 'menu' || state.mode === 'paused') && primaryAction) {
        e.preventDefault();
        primaryAction();
      }
    }
  });

  window.addEventListener('keyup', (e) => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
    if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  });

  els.btn.addEventListener('click', () => {
    initAudio();
    if (primaryAction) primaryAction();
  });

  els.mute.addEventListener('click', () => setMuted(!muted));

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) pauseGame();
  });

  /* ══════════════ 尺寸與主迴圈 ══════════════ */
  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.round(rect.width * dpr));
    const h = Math.max(1, Math.round(rect.height * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
  }

  if (window.ResizeObserver) {
    new ResizeObserver(resizeCanvas).observe(canvas);
  } else {
    window.addEventListener('resize', resizeCanvas);
  }

  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    state.time += dt;

    updatePaddle(dt);
    if (state.mode === 'playing') updateGame(dt);
    updateEffects(dt);
    draw();

    requestAnimationFrame(frame);
  }

  /* ══════════════ 啟動 ══════════════ */
  function init() {
    setMuted(muted);
    buildStars();
    bricks.push(...buildBricks(0));
    updateHUD();
    resizeCanvas();
    showOverlay({
      badge: 'Breakout',
      title: '打磚塊',
      text: '移動擋板接住球，把上方的磚塊全部擊碎。每過一關，速度會更快。',
      btn: '開始遊戲',
      action: startGame,
    });
    last = performance.now();
    requestAnimationFrame(frame);
  }

  init();
})();
</script>
</body>
</html>
